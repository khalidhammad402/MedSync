{% import "_macros.html" as m %}
<div class="modal" role="dialog" aria-modal="true" aria-label="Change instruction">
  <div class="modal-card">
    <button type="button" class="close" data-close="modal" aria-label="Close">&times;</button>
    <p class="eyebrow">Change instruction</p>
    <h2>{{ med.label }}</h2>
    <p class="plain-label">Records your decision. MedSync does not suggest doses.</p>
    <form hx-post="/prescriptions/{{ med.prescription_id }}/instruction" hx-target="#instruction-preview" hx-swap="innerHTML">
      <label for="instruction-text">The instruction you decided on</label>
      <input id="instruction-text" name="text" value="{{ med.instruction_text }}" autocomplete="off" required
             hx-post="/prescriptions/{{ med.prescription_id }}/instruction" hx-trigger="input changed delay:250ms"
             hx-target="#instruction-preview" hx-swap="innerHTML">
      <p class="hint">Morning-noon-evening, for example 1-0-½, or free text.</p>
      <div id="instruction-preview">{% include "_instruction_preview.html" %}</div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close="modal">Cancel</button>
        <button class="btn primary" name="confirm" value="true">Confirm and record</button>
      </div>
    </form>
  </div>
</div>
